name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No GPU here: Triton kernels run on the CPU through its interpreter,
    # which checks correctness. Speed is measured separately on a real GPU.
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton numpy -r requirements-dev.txt

      - name: Show versions
        run: python -c "import torch, triton; print('torch', torch.__version__, '| triton', triton.__version__)"

      - name: Run tests
        run: pytest -v
